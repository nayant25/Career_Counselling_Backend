spring.application.name=Carrer_Counselling
spring.datasource.url=jdbc:mysql://localhost:3306/career_explorer
spring.datasource.username=root
spring.datasource.password=${SQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#Google OAuth2
spring.security.oauth2.client.registration.google.client-id = ${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret = ${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid, profile, email
spring.security.oauth2.client.provider.google.user-info-url =https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
# Logging
logging.level.root=INFO
logging.level.com.brainchain.career_counselling=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG


#Email Configuration
spring.mail.host =smtp.gmail.com
spring.mail.port = 587
spring.mail.username = nayantayade2017@gmail.com
spring.mail.password = ${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true

jwt.secret = ${JWT_SECRET}
xai.api.key=${ChatGPTAI_API_KEY}
